name: Build and Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The toolchain version is pinned by lethe-launcher/rust-toolchain.toml;
      # rustup installs it on the first cargo call below.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lethe-launcher

      - name: Test
        run: |
          cd lethe-launcher
          cargo test

      - name: Build launcher
        run: |
          cd lethe-launcher
          cargo build --release

      - name: Prepare release artifacts
        shell: powershell
        run: |
          $exe = "lethe-launcher\target\release\LimbusCompany.exe"

          # Raw exe is the release asset the updater downloads and swaps in place.
          Copy-Item $exe -Destination "LimbusCompany.exe" -Force

          # SHA-256 the exact bytes the updater will fetch, so the client can verify.
          $sha = (Get-FileHash "LimbusCompany.exe" -Algorithm SHA256).Hash.ToLower()

          # Generate latest.json for the updater
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $version) { $version = "0.0.0" }

          $latestJson = @{
            version = $version
            notes = "Release ${{ github.ref_name }}"
            download_url = "https://github.com/${{ github.repository }}/releases/latest/download/LimbusCompany.exe"
            sha256 = $sha
          } | ConvertTo-Json

          # Write UTF-8 without a byte-order mark: Out-File -Encoding utf8 adds
          # one on Windows PowerShell, and the launcher's JSON parser rejects it.
          [System.IO.File]::WriteAllText((Join-Path $PWD "latest.json"), $latestJson, (New-Object System.Text.UTF8Encoding $false))

          Write-Host "Build version: $version"
          Write-Host "SHA-256: $sha"
          Write-Host "Artifacts:"
          Get-ChildItem "LimbusCompany.exe", latest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LimbusCompany-build-${{ github.run_number }}
          path: |
            LimbusCompany.exe
            latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Create release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LimbusCompany.exe
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release on push to main
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build (${{ github.run_number }})
          body: |
            🚀 Automated build from commit `${{ github.sha }}`

            Download `LimbusCompany.exe` and place it in your game directory alongside `UnityPlayer.dll`.

            The launcher will auto-detect this as the latest version via the updater.
          files: |
            LimbusCompany.exe
            latest.json
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
