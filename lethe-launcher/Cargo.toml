[package]
name = "LimbusCompany"
version = "1.0.1"
description = "Lethe Launcher - Limbus Company custom launcher"
authors = ["Lethe"]
edition = "2021"
build = "build.rs"

[[bin]]
name = "LimbusCompany"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
futures-util = "0.3"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twox-hash = "1.6"
libloading = "0.8"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
